<div class="card-group-element-item">
    <div class="card">
        <div class="card-img-top">
            <picture>
                <img src="{f:uri.resource(path: hall.image, extensionName: 'saalevent')}" alt="{hall.title}" />
            </picture>
        </div>
                      
        <div class="card-body">
            <h2 class="card-title">
                {hall.title}
            </h2>
            <p>{hall.event.message}</p>
        </div>
    </div>
</div>
